<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBER SWEEPER // Сапёр</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid"></div>

  <main class="app-container">
    <header class="game-header">
      <div class="title-block">
        <span class="badge">SYS.09</span>
        <h1>MINESWEEPER</h1>
      </div>

      <div class="controls-bar">
        <div class="difficulty-selector" role="group" aria-label="Сложность">
          <button class="diff-btn active" data-diff="easy">9×9</button>
          <button class="diff-btn" data-diff="medium">16×16</button>
          <button class="diff-btn" data-diff="hard">16×30</button>
        </div>

        <button id="sound-toggle" class="icon-btn" title="Звук" aria-label="Переключить звук">
          🔊
        </button>
      </div>
    </header>

    <section class="hud-panel">
      <div class="stat-box">
        <span class="stat-label">МИНЫ</span>
        <span id="mines-count" class="stat-value neon-pink">010</span>
      </div>

      <button id="reset-btn" class="reset-btn" title="Новая игра">
        <span id="face-icon">😎</span>
      </button>

      <div class="stat-box">
        <span class="stat-label">ВРЕМЯ</span>
        <span id="timer" class="stat-value neon-cyan">000</span>
      </div>
    </section>

    <div class="board-wrapper">
      <div id="board" class="board" oncontextmenu="return false;"></div>
      
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <h2 id="overlay-title">ПОБЕДА</h2>
          <p id="overlay-subtitle">Поле зачищено за 00 сек.</p>
          <button id="overlay-btn" class="primary-btn">ИГРАТЬ СНОВА</button>
        </div>
      </div>
    </div>

    <footer class="game-footer">
      <span>ЛКМ — открыть</span>
      <span>•</span>
      <span>ПКМ / Долгий тап — флаг</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
